[build-system]
requires = ["hatchling>=1.5"]
build-backend = "hatchling.build"

[project]
name = "rdf-kernel"
version = "1.0.0"
description = "A Jupyter kernel for RDF processing with SPARQL and SHACL support"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Jim White", email = "jim@example.com"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Shells",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "ipykernel>=6.30",
    "traitlets>=5.0",
    "rdflib>=7.0.0",
    "SPARQLWrapper>=2.0.0",
    "pyshacl>=0.25.0",
    "pygments>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jupyter>=1.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/jimwhite/rdf-kernel"
Repository = "https://github.com/jimwhite/rdf-kernel"
"Bug Tracker" = "https://github.com/jimwhite/rdf-kernel/issues"

[project.scripts]
install-rdf-kernel = "rdf_kernel.install:main"

[tool.hatch.build.targets.wheel]
packages = ["rdf_kernel"]

[tool.hatch.build.targets.sdist]
include = [
    "/rdf_kernel",
    "/README.md",
    "/LICENSE",
]
